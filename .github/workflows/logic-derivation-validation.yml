name: logic derivation validation

on:
  push:
    branches:
      - agent/logic-derivation-surface-trace
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q reasoning_core/tasks/logic_derivation.py tests/test_logic_derivation.py
      - name: Focused and logic regression tests
        run: pytest -q tests/test_logic_derivation.py tests/test_logic_deep.py tests/test_config_difficulty_migration.py
      - name: Multi-pack multi-level generation stress
        run: |
          python - <<'PY'
          import re
          from reasoning_core.tasks.logic_depth import MultistepNLIConfig
          from reasoning_core.tasks.logic_derivation import LogicDerivation

          packs = ("surface", "abstract", "kinship", "spatial")
          for level in range(3):
              for pack in packs:
                  cfg = MultistepNLIConfig(domain_packs=(pack,))
                  cfg.set_level(level)
                  task = LogicDerivation(config=cfg)
                  for _ in range(20):
                      ex = task.generate_example(max_tokens=0)
                      assert task.score_answer(ex.answer, ex) == 1
                      assert ex.metadata.domain_pack == pack
                      for i, line in enumerate(ex.answer.splitlines()):
                          refs = [x for x in line.split() if x.startswith("@")]
                          assert all(int(x[1:]) < i for x in refs)
                      if pack == "abstract":
                          assert not re.search(r"\b[pr]\d+\(", ex.answer)
          PY
