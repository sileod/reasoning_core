[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reasoning_core"
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
description = "Procedural data generators for symbolic pre-training, also including RL environments"

dependencies = [
    "typing-extensions",
    "gramforge",
    "faker",
    "inflection",
    "rapidfuzz",
    "unified-planning[pyperplan]",
    "tarski",
    "tiktoken",
    "networkx",
    "z3-solver",
    "pooch",
    "requests",
    "beautifulsoup4",
    "easydict",
    "appdirs",
    "regex",
    "greenery",
    "tqdm",
    "timeoutcontext",
    "pandas",
    "pyyaml",
    "tabulate",
    "duckdb",
    "funcy",
    "multiprocess",
    "xpflow",
    "exrex",
    "nltk",
    "wordfreq",
    "pgmpy",
    "unification",
    "toolz",
    "numpy",
    "sympy",
    "pyparsing",
    "whatthepatch",
    "lazy_object_proxy",
    "udocker",
    "wrapt",
    "psutil",
    "nfsdict",
    "xxhash",
]

[project.optional-dependencies]
prime = ["prime", "verifiers"]
reasoning_gym = ["reasoning_gym"]
training = ["torch", "transformers", "datasets", "trl", "safetensors", "prodigyplus"]
eval = ["litlm"]
collection = ["huggingface-hub", "pyarrow"]

[tool.hatch.version]
path = "reasoning_core/__init__.py"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "/reasoning_core/**/__pycache__",
    "/reasoning_core/**/.ipynb_checkpoints",
    "/reasoning_core/.mountpoints/**",
    "/reasoning_core/checkpoints/**",
    "/reasoning_core/generated_data/**",
    "/reasoning_core/index/**",
    "/integrations/**/.pytest_cache/**",
    "/integrations/**/.venv/**",
    "/reasoning_core/score_cache/**",
    "/reasoning_core/wandb/**",
]

[tool.hatch.build.targets.wheel]
packages = ["reasoning_core"]
exclude = ["/reasoning_core/task_search/**", "/reasoning_core/reports/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/GALLERY.md",
    "/LICENSE",
    "/README.md",
    "/TASK_AUTHORING_GUIDE.md",
    "/TASK_MUTATION_GUIDE.md",
    "/AGENTS.md",
    "/docs/workflows.md",
    "/docs/evaluation.md",
    "/docs/layout.md",
    "/docs/influence.md",
    "/docs/results",
    "/integrations",
    "/requirements",
    "/scripts",
    "/pyproject.toml",
    "/reasoning_core",
    "/task_influence",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".hypothesis",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".test",
    ".venv",
    "__pycache__",
    "checkpoints",
    "data-gym-cache",
    "per_task_results",
    "per_task_results_rgym",
    "integrations",
    "reasoning_core/.mountpoints",
    "reasoning_core/generated_data",
    "reasoning_core/index",
    "reasoning_core/score_cache",
]
